<!doctype html>
<html><head><meta charset="utf-8">
<script src="../../web/node_modules/gsap/dist/gsap.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:500px;overflow:hidden;background:#0d0d10}
body{font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;position:relative}
#fundo{position:absolute;inset:0;background:radial-gradient(900px 420px at 30% 40%,#1b1b22 0,transparent 70%),#0d0d10}
#luz{position:absolute;width:900px;height:900px;left:900px;top:-200px;border-radius:50%;
  background:radial-gradient(circle,#ffc40026 0,transparent 60%);opacity:0}
#grao{position:absolute;inset:0;opacity:.05;background-image:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px)}
.palco{position:absolute;inset:0}
.lin{position:absolute;height:1.5px;background:#4f7cff;transform-origin:left center}
.vl{position:absolute;width:0;border-left:1.5px dashed #c9c9d1aa;transform-origin:top center}
.chip{position:absolute;padding:3px 9px;border-radius:6px;font:600 17px "Segoe UI",sans-serif;color:#fff;background:#1e1e26;border:1px solid #ffffff2a;white-space:nowrap}
.rot{position:absolute;font:600 19px "Segoe UI",sans-serif;white-space:nowrap}
.seta{position:absolute;width:2px;transform-origin:bottom center}
.seta:before{content:"";position:absolute;top:-7px;left:-5px;border:6px solid transparent;border-bottom:8px solid currentColor;border-top:0}
#marca{position:absolute;left:150px;top:150px;font:750 158px/1 "Segoe UI Variable Display","Segoe UI",sans-serif;letter-spacing:-.04em;white-space:nowrap}
#marca span{display:inline-block}
.b{background:linear-gradient(180deg,#ffffff 0,#b9b9c2 100%);-webkit-background-clip:text;color:transparent}
.a{color:#ffc400}
#lema{position:absolute;left:150px;top:446px;font:400 26px "Segoe UI",sans-serif;color:#9a9aa3}
#lema b{color:#f5f5f7;font-weight:600}
svg{position:absolute;left:0;top:0}
#logo{position:absolute;left:690px;top:140px;width:220px;height:220px}
.porta{position:absolute;top:0;width:110px;height:220px;background:#ffc400;overflow:hidden}
#portaE{left:0;border-radius:60px 0 0 60px}#portaD{left:110px;border-radius:0 60px 60px 0}
.brilho{position:absolute;top:-40px;width:60px;height:300px;background:linear-gradient(90deg,transparent,#ffffffaa,transparent);transform:skewX(-20deg)}
#brilhoE{left:-90px}#brilhoD{left:-200px}
#estrela{position:absolute;left:0;top:0;width:220px;height:220px}
#aro{position:absolute;left:800px;top:250px;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;border:2px solid #ffc400;opacity:0}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
</style></head>
<body>
<div id="fundo"></div><div id="luz"></div>

<!-- ATO 1: a logo do aplicativo chega e abre como uma porta para a marca -->
<div class="palco" id="ato1">
  <div id="aro"></div>
  <div id="logo">
    <div class="porta" id="portaE"><div class="brilho" id="brilhoE"></div></div>
    <div class="porta" id="portaD"><div class="brilho" id="brilhoD"></div></div>
    <svg id="estrela" viewBox="0 0 100 100"><polygon points="50.00,16.00 58.13,41.87 84.00,50.00 58.13,58.13 50.00,84.00 41.87,58.13 16.00,50.00 41.87,41.87" fill="#1d1b18"/></svg>
  </div>
</div>

<!-- ATO 2: a mesma régua, agora na marca -->
<div class="palco" id="ato2" style="opacity:0">
  <div class="lin d" style="left:110px;top:186px;width:1180px"></div>
  <div class="lin d" style="left:110px;top:225px;width:1180px"></div>
  <div class="lin d" style="left:110px;top:298px;width:1180px"></div>
  <div class="lin d" style="left:110px;top:333px;width:1180px"></div>
  <div class="chip d2" style="left:62px;top:190px">1.0</div>
  <div class="chip d2" style="left:62px;top:248px">2.4</div>
  <div class="chip d2" style="left:62px;top:302px">1.0</div>
  <div id="marca"><span class="b" id="m1">Projeto</span><span style="width:.22em"></span><span class="a" id="m2">Canais</span></div>
  <div class="vl d3" style="left:718px;top:110px;height:250px"></div>
  <div class="chip d3" style="left:690px;top:76px">0 px</div>
  <svg width="1600" height="500" id="svg2">
    <path id="curva" d="M640 298 C 690 120, 760 90, 840 112 S 905 125, 910 122" stroke="#ffc400" stroke-width="3" fill="none"/>
    <circle id="cpt" cx="910" cy="122" r="6" fill="#ffc400"/>
    <path class="ang" d="M245 298 A40 40 0 0 1 222 266" stroke="#fff" stroke-width="1.5" fill="none"/>
    <path class="ang" d="M1150 298 A40 40 0 0 0 1128 262" stroke="#fff" stroke-width="1.5" fill="none"/>
    <line class="ang" x1="205" y1="298" x2="265" y2="230" stroke="#fff" stroke-width="1.5"/>
    <line class="ang" x1="1110" y1="298" x2="1180" y2="236" stroke="#fff" stroke-width="1.5"/>
  </svg>
  <div class="chip d4" style="left:178px;top:120px">73.2°</div>
  <div class="chip d4" style="left:1185px;top:205px">41.9°</div>
  <div class="rot d4" style="left:932px;top:108px;color:#fff">entra back.out 0.28 s</div>
  <div class="seta d5" style="left:320px;top:340px;height:40px;color:#ff4fd8;background:#ff4fd8"></div>
  <div class="rot d5" style="left:250px;top:388px;color:#ff6fe0">roteiro com fonte</div>
  <div class="seta d5" style="left:560px;top:340px;height:40px;color:#ff9f1a;background:#ff9f1a"></div>
  <div class="rot d5" style="left:505px;top:388px;color:#ffae3d">voz neural</div>
  <div class="seta d5" style="left:760px;top:340px;height:40px;color:#3ddc84;background:#3ddc84"></div>
  <div class="rot d5" style="left:688px;top:388px;color:#3ddc84">legenda na fala</div>
  <div class="seta d5" style="left:1010px;top:340px;height:40px;color:#ffd23f;background:#ffd23f"></div>
  <div class="rot d5" style="left:955px;top:388px;color:#ffd23f">12h · 19h</div>
  <div class="chip" id="maxx" style="left:1335px;top:232px;color:#3ddc84;border-color:#3ddc84;font-size:20px">✓ no ar</div>
  <svg width="1600" height="500"><line id="setamax" x1="1328" y1="250" x2="1300" y2="250" stroke="#3ddc84" stroke-width="2"/></svg>
  <div id="lema"><b>a fábrica de vídeos</b> que roda no seu PC</div>
</div>

<div id="flash"></div>
<div id="grao"></div>

<script>
// timeline determinística: pausada, sem Math.random, avançada quadro a quadro pelo render
const q = s => document.querySelectorAll(s);
const tl = gsap.timeline({paused: true});
const E = {entra: "back.out(1.8)", bate: "power4.in", assenta: "elastic.out(1,.5)", sai: "power2.in", respira: "sine.inOut"};

// estado inicial
gsap.set(".lin", {scaleX: 0});
gsap.set(".vl", {scaleY: 0});
gsap.set(".chip, .rot", {opacity: 0, y: 8});
gsap.set(".seta", {scaleY: 0});
["#curva", "#setamax"].forEach(id => {
  const el = document.querySelector(id); const L = el.getTotalLength ? el.getTotalLength() : 300;
  el.style.strokeDasharray = L; el.style.strokeDashoffset = L; el.dataset.L = L; });
q(".ang").forEach(el => { const L = el.getTotalLength(); el.style.strokeDasharray = L; el.style.strokeDashoffset = L; });
gsap.set(["#cpt"], {scale: 0, transformOrigin: "center"});
gsap.set(["#m1", "#m2"], {opacity: 0, scale: 3.2, transformOrigin: "50% 60%"});
gsap.set("#lema", {opacity: 0, y: 10});

// ATO 1 (0 a 1,7 s): a logo chega de pequena, a estrela gira e assenta, um brilho passa e a logo abre
gsap.set("#logo", {scale: .35, opacity: 0, transformOrigin: "50% 50%"});
gsap.set("#estrela", {rotation: -135, scale: .6, transformOrigin: "50% 50%"});
tl.to("#logo", {scale: 1, opacity: 1, duration: .42, ease: E.entra}, .1)
  .to("#estrela", {rotation: 0, scale: 1, duration: .7, ease: E.assenta}, .2)
  .to("#brilhoE", {x: 330, duration: .45, ease: "power2.inOut"}, .72)
  .to("#brilhoD", {x: 330, duration: .45, ease: "power2.inOut"}, .72)
  .to("#logo", {scale: 1.06, duration: .2, ease: "power2.out"}, 1.0)
  .to("#estrela", {scale: 1.3, duration: .16, ease: "power2.out"}, 1.0)
  .to("#estrela", {scale: 0, rotation: 90, duration: .22, ease: E.sai}, 1.16)
  .to("#portaE", {x: -900, duration: .42, ease: E.bate}, 1.22)
  .to("#portaD", {x: 900, duration: .42, ease: E.bate}, 1.22)
  .to("#aro", {opacity: .9, duration: .05, ease: "none"}, 1.22)
  .to("#aro", {width: 1500, height: 1500, marginLeft: -750, marginTop: -750, opacity: 0, duration: .6, ease: "power3.out"}, 1.25)
  .to("#flash", {opacity: .35, duration: .03, ease: "none"}, 1.6)
  .to("#flash", {opacity: 0, duration: .22, ease: "power2.out"}, 1.63)
  .set("#ato2", {opacity: 1}, 1.6);

// ATO 2 (1,65 a 5,6 s): a marca chega de grande e assenta; a mesma régua mede tudo certo
tl.to("#m1", {opacity: 1, scale: 1, duration: .38, ease: "power4.out"}, 1.65)
  .to("#m2", {opacity: 1, scale: 1, duration: .38, ease: "power4.out"}, 1.77)
  .to("#luz", {opacity: 1, duration: 1.2, ease: E.respira}, 1.70)
  .to("#ato2 .d", {scaleX: 1, duration: .32, ease: "power3.out", stagger: .05}, 2.05)
  .to("#ato2 .d2", {opacity: 1, y: 0, duration: .22, ease: E.entra, stagger: .05}, 2.25)
  .to("#ato2 .d3", {scaleY: 1, opacity: 1, y: 0, duration: .25, ease: E.entra}, 2.35)
  .to("#curva", {strokeDashoffset: 0, duration: .55, ease: "power2.out"}, 2.45)
  .to("#cpt", {scale: 1, duration: .3, ease: E.assenta}, 2.90)
  .to("#ato2 .ang", {strokeDashoffset: 0, duration: .3, stagger: .05}, 2.60)
  .to("#ato2 .d4", {opacity: 1, y: 0, duration: .25, ease: E.entra, stagger: .06}, 2.75)
  .to("#ato2 .seta", {scaleY: 1, duration: .22, ease: E.entra, stagger: .08}, 2.90)
  .to("#ato2 .rot.d5", {opacity: 1, y: 0, duration: .25, ease: E.entra, stagger: .08}, 3.00)
  .to("#setamax", {strokeDashoffset: 0, duration: .2}, 3.45)
  .to("#maxx", {opacity: 1, y: 0, scale: 1, duration: .35, ease: E.entra}, 3.50)
  .to("#lema", {opacity: 1, y: 0, duration: .4, ease: "power3.out"}, 3.75)
  .to("#marca", {x: 4, duration: 3, ease: E.respira}, 1.90)
  .to({}, {duration: 1.4}, 4.15);   // fim parado e resolvido

window.tl = tl; window.DUR = tl.duration();
</script>
</body></html>
